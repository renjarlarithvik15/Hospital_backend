# ===================================================================
# Hospital Management System - Spring Boot Configuration (MySQL)
# ===================================================================
server.port=${PORT:8080}

# -------------------------------------------------------------------
# MySQL Database Connection Settings (Online Aiven Cloud MySQL)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://mysql-2ae0a1ea-hospitaldatabse.h.aivencloud.com:21813/defaultdb?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:avnadmin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Cloud Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# Static Resource Mapping & File Uploads
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
